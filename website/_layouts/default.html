<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ page.title }} - {{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <nav class="site-nav">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
          <a href="{{ '/#faq' | relative_url }}">FAQ</a>
        </nav>
      </div>
      <div class="hero">
        <div class="container hero-inner">
        {% if page.show_feature_graphic %}
        <figure class="hero-graphic-wrapper hero-graphic-left">
          <img class="hero-graphic" src="{{ '/assets/images/feature-graphic.svg' | relative_url }}" alt="Retirement Countdown feature graphic">
        </figure>
        {% endif %}
        </div>
      </div>
    </header>

    <main class="container site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">© {{ "now" | date: "%Y" }} Retirement Countdown</div>
    </footer>
  </body>
</html>
